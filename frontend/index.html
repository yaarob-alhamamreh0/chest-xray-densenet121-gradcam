<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Chest X-Ray AI Diagnostic & Grad-CAM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-8">
  <div class="max-w-6xl mx-auto space-y-8">
    <header class="text-center">
      <h1 class="text-4xl font-extrabold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">🫁 Chest X-Ray AI Diagnostics</h1>
      <p class="text-slate-400 mt-2">DenseNet-121 Classification with Explainable Grad-CAM Heatmaps</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
      <div class="md:col-span-5 bg-slate-900/70 border border-slate-800 rounded-2xl p-6">
        <label class="block text-sm font-medium mb-3">Upload Patient Chest X-Ray</label>
        <input type="file" id="fileInput" accept="image/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
        <button onclick="uploadAndPredict()" id="submitBtn" class="w-full mt-5 py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl transition">Run Diagnostics</button>
      </div>

      <div class="md:col-span-7 bg-slate-900/70 border border-slate-800 rounded-2xl p-6">
        <div id="resultsView" class="hidden space-y-6">
          <div class="grid grid-cols-2 gap-4">
            <div class="p-4 bg-slate-800/60 rounded-xl border border-indigo-500/30">
              <span class="text-xs text-slate-400 font-semibold">Diagnosis</span>
              <h2 id="diagClass" class="text-2xl font-bold mt-1 text-white">---</h2>
            </div>
            <div class="p-4 bg-slate-800/60 rounded-xl border border-indigo-500/30">
              <span class="text-xs text-slate-400 font-semibold">Confidence</span>
              <h2 id="diagConf" class="text-2xl font-bold mt-1 text-white">---</h2>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <p class="text-xs text-slate-400 mb-2 font-medium">Original X-Ray</p>
              <img id="origImg" class="w-full h-48 object-cover rounded-xl border border-slate-700">
            </div>
            <div>
              <p class="text-xs text-slate-400 mb-2 font-medium">Grad-CAM Heatmap</p>
              <img id="camImg" class="w-full h-48 object-cover rounded-xl border border-indigo-500">
            </div>
          </div>
          <div class="h-44"><canvas id="chartCanvas"></canvas></div>
        </div>
        <div id="emptyView" class="h-64 flex items-center justify-center text-slate-500">Upload an X-Ray to view diagnostic breakdown.</div>
      </div>
    </div>
  </div>

  <script>
    let chart = null;
    async function uploadAndPredict() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) return alert('Please select an image first.');
      
      const formData = new FormData();
      formData.append('file', file);
      
      document.getElementById('origImg').src = URL.createObjectURL(file);
      const btn = document.getElementById('submitBtn');
      btn.innerText = 'Analyzing...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/predict', { method: 'POST', body: formData });
        const data = await res.json();
        
        document.getElementById('emptyView').classList.add('hidden');
        document.getElementById('resultsView').classList.remove('hidden');
        document.getElementById('diagClass').innerText = data.predicted_class;
        document.getElementById('diagConf').innerText = (data.confidence * 100).toFixed(1) + '%';
        document.getElementById('camImg').src = data.gradcam_image;

        const labels = Object.keys(data.probabilities);
        const values = Object.values(data.probabilities).map(v => (v * 100).toFixed(1));

        if (chart) chart.destroy();
        chart = new Chart(document.getElementById('chartCanvas'), {
          type: 'bar',
          data: { labels: labels, datasets: [{ label: 'Probability (%)', data: values, backgroundColor: ['#3b82f6', '#ef4444', '#f59e0b'] }] },
          options: { responsive: true, maintainAspectRatio: false, scales: { y: { max: 100 } } }
        });
      } catch (err) { alert('Prediction error: ' + err.message); }
      finally { btn.innerText = 'Run Diagnostics'; btn.disabled = false; }
    }
  </script>
</body>
</html>
